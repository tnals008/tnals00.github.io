<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>북원여자고등학교 분실물 센터</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;min-height:100vh;margin:auto;background:#fff}
header{height:68px;border-bottom:1px solid #e8e9eb;padding:0 30px;display:flex;align-items:center}.logo{font-size:17px;font-weight:800}
.screen{display:none!important}.screen.active{display:block!important}.home{text-align:center;padding:92px 28px 100px}.home h1{font-size:36px;line-height:1.38;letter-spacing:-2px;margin:0 0 20px}
.actions{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}.action{height:155px;background:#fff;border:1px solid #e0e3e6;border-radius:18px;text-align:left;padding:27px 25px;cursor:pointer;transition:.15s}.action:hover{border-color:#20242a;transform:translateY(-2px)}.action b{display:block;font-size:19px;letter-spacing:-.5px;margin-bottom:11px}.action span{font-size:13px;color:#777;line-height:1.5}
.page{padding:30px 30px 65px;width:100%}.back{border:0;background:none;padding:0;margin-bottom:22px;color:#72777d;font-size:13px}h2{font-size:28px;letter-spacing:-1.2px;margin:0 0 26px}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.category{border:1px solid #e1e4e7;background:#fff;border-radius:14px;padding:16px 14px;text-align:center;cursor:pointer;font-size:13px}.category:hover{border-color:#20242a}.category b{display:block;font-weight:700;margin-bottom:3px}.category small{font-size:11px;color:#80858b}
.toolbar{display:flex;gap:9px;margin:18px 0 13px}.search{flex:1;border:1px solid #ddd;border-radius:9px;padding:11px 12px;outline:none}.cat-btn{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 13px;font-size:12px}
.table-wrap{border:1px solid #e1e4e7;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:880px;font-size:13px}th{background:#f8f9fa;color:#6c7279;font-weight:600;text-align:left;padding:13px 12px;border-bottom:1px solid #e1e4e7}td{padding:14px 12px;border-bottom:1px solid #eef0f2}.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px}.empty{text-align:center;padding:52px;color:#888}
.slide-container{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;padding-bottom:10px;scroll-behavior:smooth;padding-right:20px}.slide-card{flex:0 0 calc(100% - 60px);background:#fff;border:1px solid #e7e9eb;border-radius:14px;padding:24px;scroll-snap-align:start}
.field{margin-bottom:18px}.req{color:#d32f2f}.field label{display:block;font-size:12px;color:#333;margin-bottom:8px;font-weight:500}input,select,textarea{width:100%;border:1px solid #ddd;border-radius:9px;padding:11px 12px;background:#fff;outline:none;font-size:13px}input:focus,select:focus,textarea:focus{border-color:#666;box-shadow:none}textarea{min-height:80px;resize:vertical}
.upload-box{border:1px dashed #cdd1d5;border-radius:9px;padding:13px;background:#fafbfc;font-size:12px;color:#777}
.highlight{background:linear-gradient(120deg,rgba(255,193,7,.3) 0%,rgba(255,193,7,.3) 100%);padding:0 3px}
.notice{font-size:11px;color:#666;margin-top:10px;line-height:1.6}
.submit{display:none;width:100%;border:0;background:#20242a;color:#fff;border-radius:10px;padding:13px;font-weight:700;margin-top:10px;cursor:pointer}.submit:hover{background:#0f0f0f}
.confirm-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center}.modal-content{background:#fff;border-radius:12px;padding:28px;max-width:500px;width:90%}.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}.modal-body{font-size:13px;color:#666;margin-bottom:20px;line-height:1.6;text-align:left}.modal-buttons{display:flex;gap:10px;justify-content:flex-end}.modal-btn{border:1px solid #ddd;background:#fff;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer}.modal-btn.confirm{background:#20242a;color:#fff;border-color:#20242a}.modal-btn:hover{background:#f5f5f5}.modal-btn.confirm:hover{background:#0f0f0f}
.done{position:fixed;top:68px;left:0;right:0;bottom:0;width:100%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;z-index:100;padding-top:80px}.done h2{margin:0 0 12px;font-size:32px}.done p{margin:0 0 24px}
@media(max-width:700px){header{padding:0 18px}.home{padding:70px 18px 80px}.home h1{font-size:29px}.actions{grid-template-columns:1fr}.page{padding:28px 18px 55px}.categories{grid-template-columns:repeat(2,1fr)}.slide-container{gap:16px}.slide-card{padding:18px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">북원여자고등학교 분실물 센터</div></header>

<section id="home" class="screen active home">
<h1>잃어버린 물건,<br>지금 학교에서 확인하세요</h1>
<div class="actions">
<button class="action" onclick="show('find')"><b>분실물 찾기</b><span>등록된 분실물을 빠르게 확인합니다.</span></button>
<button class="action" onclick="show('register')"><b>분실물 등록</b><span>습득한 물건의 정보를 등록합니다.</span></button>
</div></section>

<section id="find" class="screen page"><button class="back" onclick="show('home')">← 처음으로</button>
<h2>어떤 물건을 찾나요?</h2>
<div class="categories">
<button class="category" onclick="list('전체')" style="background:#2563eb;color:#fff;border-color:#2563eb"><b>전체분실물</b></button><button class="category" onclick="list('우산')"><b>우산</b><small>우산·양산</small></button>
<button class="category" onclick="list('의류')"><b>의류</b><small>외투·체육복</small></button><button class="category" onclick="list('문구')"><b>문구</b><small>필통·노트</small></button>
<button class="category" onclick="list('전자기기')"><b>전자기기</b><small>이어폰·충전기</small></button><button class="category" onclick="list('카드')"><b>카드</b><small>학생증·지갑</small></button>
<button class="category" onclick="list('생활용품')"><b>생활용품</b><small>텀블러·물병</small></button><button class="category" onclick="list('기타')"><b>기타</b><small>기타 물품</small></button>
</div></section>

<section id="items" class="screen page"><button class="back" onclick="show('find')">← 종류 다시 선택</button><h2 id="listTitle">전체 분실물</h2>
<div class="toolbar"><input id="q" class="search" placeholder="물품명·설명·발견장소 검색" oninput="render()"><button class="cat-btn" onclick="show('find')">카테고리</button></div>
<div class="table-wrap"><table><thead><tr><th>사진</th><th>물품</th><th>설명</th><th>습득일자</th><th>발견장소</th><th>보관장소</th></tr></thead><tbody id="tbody"></tbody></table></div></section>

<section id="register" class="screen page"><button class="back" onclick="show('home')">← 처음으로</button><h2>분실물 등록</h2>
<div class="slide-container" id="slideContainer">
<div class="slide-card">
<div style="font-size:14px;font-weight:700;margin-bottom:20px">물품 정보</div>
<div class="field"><label>종류 <span class="req">*</span></label><select id="cat" required><option value="">선택</option><option>우산</option><option>의류</option><option>문구</option><option>전자기기</option><option>카드</option><option>생활용품</option><option>기타</option></select></div>
<div class="field"><label>물품 이름 <span class="req">*</span></label><input id="name" required placeholder="예: 검정색 3단 우산"></div>
<div class="field"><label>설명</label><textarea id="desc" placeholder="브랜드, 모양, 상태 등"></textarea></div>
<div class="field"><label>사진</label><div class="upload-box"><input id="photo" type="file" accept="image/*" style="cursor:pointer"></div><div class="notice">💡 연락처, 얼굴 등 <span class="highlight">개인정보는 가려진 사진</span>으로 첨부해주세요.</div></div>
</div>

<div class="slide-card">
<div style="font-size:14px;font-weight:700;margin-bottom:20px">습득·보관 정보</div>
<div class="field"><label>습득일자 <span class="req">*</span></label><input id="date" type="date" required></div>
<div class="field"><label>발견장소 <span class="req">*</span></label><input id="place" required placeholder="예: 1학년동 2층 복도, 3-4반 앞"><div class="notice">💡 <span class="highlight">정확한 발견장소</span>를 기재해주세요.</div></div>
<div class="field"><label>보관장소 <span class="req">*</span></label><select id="store" required onchange="toggleStoreInput()"><option value="">선택</option><option>1학년 교무실</option><option>1학년동 보관 사물함</option><option>2학년 교무실</option><option>3학년 교무실</option><option>행정실</option><option>기타</option></select></div>
<div id="storeInputWrap" class="field" style="display:none;"><label>기타 보관장소 <span class="req">*</span></label><input id="storeCustom" placeholder="예: 교실 뒤 선반, 보건실"></div>
</div>
</div>

<form id="form" onsubmit="confirmAdd(event)" style="display:none"></form>
</div>

<button class="submit" onclick="confirmAdd(event)">등록하기</button>
</section>

<section id="admin" class="screen page" style="max-width:600px;margin:auto">
<button class="back" onclick="show('home')">← 처음으로</button>
<h2>관리자</h2>
<div style="background:#f3f4f6;border-radius:12px;padding:20px;margin-bottom:20px">
<div style="margin-bottom:16px"><label style="font-weight:700;margin-bottom:8px;display:block">비밀번호</label><input id="adminPass" type="password" placeholder="비밀번호 입력" style="width:100%;border:1px solid #ddd;border-radius:9px;padding:11px 12px"></div>
<button style="width:100%;border:0;background:#20242a;color:#fff;border-radius:10px;padding:13px;font-weight:700;cursor:pointer" onclick="checkAdminPass()">확인</button>
</div>
<div id="adminPanel" style="display:none">
<div style="background:#fff;border:1px solid #e1e4e7;border-radius:12px;padding:16px;margin-bottom:16px">
<h3 style="font-size:14px;margin:0 0 12px">등록된 분실물</h3>
<div id="adminList" style="font-size:13px;color:#666;line-height:1.8"></div>
</div>
<button style="width:100%;border:0;background:#d32f2f;color:#fff;border-radius:10px;padding:13px;font-weight:700;cursor:pointer;margin-bottom:10px" onclick="deleteAllData()">모든 데이터 삭제</button>
<button style="width:100%;border:1px solid #ddd;background:#fff;border-radius:10px;padding:13px;font-weight:700;cursor:pointer" onclick="show('home')">닫기</button>
</div>
</section>

<section id="done" class="screen done"><h2>등록이 완료되었습니다.</h2><p>분실물 목록에 등록되었습니다.</p><button class="cat-btn" onclick="show('home')">처음으로</button></section>

<div class="confirm-modal" id="confirmModal">
<div class="modal-content">
<div class="modal-title">입력 내용 확인</div>
<div class="modal-body" id="confirmText"></div>
<div class="modal-buttons">
<button class="modal-btn" onclick="closeConfirm()">수정하기</button>
<button class="modal-btn confirm" onclick="submitAdd()">등록하기</button>
</div>
</div>
</div>
</div>

<script>
// localStorage 완전 초기화
localStorage.clear();

let items=JSON.parse(localStorage.getItem('schoolLostFound')||'[]'),current='전체',pendingData=null;
const $=id=>document.getElementById(id);

// 사진 자동 압축 함수
function compressImage(file,callback){const reader=new FileReader();reader.onload=(e)=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');let width=img.width;let height=img.height;const maxWidth=600;const maxHeight=500;if(width>maxWidth||height>maxHeight){const ratio=Math.min(maxWidth/width,maxHeight/height);width*=ratio;height*=ratio}canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,width,height);callback(canvas.toDataURL('image/jpeg',0.5))};img.src=e.target.result};reader.readAsDataURL(file)}

function show(id){const allScreens=document.querySelectorAll('.screen');allScreens.forEach(screen=>{screen.classList.remove('active')});const target=$(id);if(target){target.classList.add('active')}const submitBtn=$('confirmModal').nextElementSibling;if(id==='register'){document.querySelectorAll('.submit').forEach(btn=>btn.style.display='block')}else{document.querySelectorAll('.submit').forEach(btn=>btn.style.display='none')}window.scrollTo(0,0)}

function list(cat){current=cat;show('items');$('listTitle').textContent=cat==='전체'?'전체 분실물':cat+' 분실물';$('q').value='';render()}

function render(){const q=$('q').value.toLowerCase();const a=items.filter(x=>(current==='전체'||x.cat===current)&&[x.name,x.desc,x.place,x.store].join(' ').toLowerCase().includes(q));$('tbody').innerHTML=a.length?a.map(x=>`<tr><td>${x.photo?`<img class="thumb" src="${x.photo}">`:'—'}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.desc)||'—'}</td><td>${x.date}</td><td>${esc(x.place)}</td><td>${esc(x.store)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">등록된 분실물이 없습니다.</td></tr>`}

function toggleStoreInput(){const v=$('store').value;$('storeInputWrap').style.display=v==='기타'?'block':'none';if(v!=='기타')$('storeCustom').value='';else $('storeCustom').required=true}

function confirmAdd(e){if(e&&e.preventDefault)e.preventDefault();if(!validateForm())return;const cat=$('cat').value;const name=$('name').value;const desc=$('desc').value;const date=$('date').value;const place=$('place').value;const store=$('store').value==='기타'?'기타; '+$('storeCustom').value:$('store').value;pendingData={cat,name,desc,date,place,store};const confirmHtml=`<p><b>종류:</b> ${esc(cat)}</p><p><b>물품:</b> ${esc(name)}</p>${desc?`<p><b>설명:</b> ${esc(desc)}</p>`:''}<p><b>습득일:</b> ${date}</p><p><b>발견장소:</b> ${esc(place)}</p><p><b>보관장소:</b> ${esc(store)}</p>`;$('confirmText').innerHTML=confirmHtml;$('confirmModal').style.display='flex'}

function validateForm(){const cat=$('cat').value;const name=$('name').value;const date=$('date').value;const place=$('place').value;const store=$('store').value;if(!cat){alert('물품 종류를 선택해주세요.');$('cat').focus();return false}if(!name){alert('물품 이름을 입력해주세요.');$('name').focus();return false}if(!date){alert('습득일자를 선택해주세요.');$('date').focus();return false}if(!place){alert('발견장소를 입력해주세요.');$('place').focus();return false}if(!store){alert('보관장소를 선택해주세요.');$('store').focus();return false}if(store==='기타'&&!$('storeCustom').value.trim()){alert('기타 보관장소를 입력해주세요.');$('storeCustom').focus();return false}return true}

function closeConfirm(){$('confirmModal').style.display='none';pendingData=null}

function submitAdd(){try{const f=$('photo').files[0];const save=p=>{try{items.unshift({cat:pendingData.cat,name:pendingData.name,desc:pendingData.desc,date:pendingData.date,place:pendingData.place,store:pendingData.store,photo:p||''});localStorage.setItem('schoolLostFound',JSON.stringify(items));$('cat').value='';$('name').value='';$('desc').value='';$('date').value='';$('place').value='';$('store').value='';$('storeCustom').value='';$('storeInputWrap').style.display='none';$('photo').value='';closeConfirm();setTimeout(()=>show('done'),100)}catch(e){console.error('Save error:',e);alert('등록 중 오류가 발생했습니다. 사진 크기를 줄여보세요.')}};if(f){compressImage(f,save)}else{save('')}}catch(e){console.error('Submit error:',e);alert('등록 중 오류가 발생했습니다.')}}

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

// 관리자 비밀번호 확인
function checkAdminPass(){const pass=$('adminPass').value;if(pass==='분실'){$('adminPanel').style.display='block';$('adminPass').parentElement.parentElement.style.display='none';showAdminList()}else{alert('비밀번호가 틀렸습니다.')}}

// 관리자 데이터 목록 표시
function showAdminList(){const list=$('adminList');if(items.length===0){list.innerHTML='<p>등록된 분실물이 없습니다.</p>'}else{let html='';items.forEach((item,idx)=>{html+=`<div style="margin-bottom:12px;padding:10px;background:#f8f9fa;border-radius:8px"><strong>${idx+1}. ${esc(item.name)}</strong><br>종류: ${esc(item.cat)} | 발견: ${esc(item.place)} | 보관: ${esc(item.store)}</div>`});list.innerHTML=html}}

// 모든 데이터 삭제
function deleteAllData(){if(confirm('정말로 모든 데이터를 삭제하시겠습니까?')){items=[];localStorage.setItem('schoolLostFound',JSON.stringify(items));alert('모든 데이터가 삭제되었습니다.');showAdminList()}}

// 관리자 접근 (Ctrl+Shift+A)
document.addEventListener('keydown',(e)=>{if(e.ctrlKey&&e.shiftKey&&e.code==='KeyA'){show('admin');e.preventDefault()}})
</script>
</body>
</html>
